<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script> <!-- defer is used to load the script after the HTML is loaded -->
    <title>Currency Converter</title>


</head>
<body>
    <img src="./assets/logo-neon.png" alt="Currency Converter" class="logo">
    <main>
        <label for="currency-from">Convert <b>from</b>:</label>
        <select id="currency-from" class="currency-from">
            <option value="BRL">Brazilian Real</option>
        <option value="USD">US Dollar</option>
        <option value="EUR">Euro</option>
        <option value="GBP">British Pound</option>
        <option value="AUD">Australian Dollar</option>
    </select>

    <label for="currency-to">Convert <b>to</b>:</label>
    <select id="currency-to" class="currency-to">
        <option value="BRL">Brazilian Real</option>
        <option value="USD" selected>US Dollar</option>
        <option value="EUR">Euro</option>
        <option value="GBP">British Pound</option>
        <option value="AUD">Australian Dollar</option>
    </select>

    <button type="button" class="swap-button">
    ⇄ Swap currencies
    </button>


    <label>
        <input class="input-amount" placeholder="Enter Amount">
    </label>

    <button class="convert-button">Convert</button>

    <section>
        <div class="currency-box">
            <img class="currency-image-from" src="./assets/brasil.png" alt="Brazilian Real">
            <p class="currency currency-name-from">Brazilian Real</p>
            <p class="amount-to-convert">R$ 0.00</p>
        </div>



        <div class="arrow">
           <img src="./assets/arrow-neon.svg" alt="Conversion direction">
        </div>

            <div class="currency-box">
                <img class="currency-image-to" src="./assets/eua.png" alt="US Dollar">
                <p class="currency currency-name-to">US Dollar</p>
                <p class="amount-converted">US$ 0.00</p>
            </div>





    </section>

</main>

</body>

</html>
